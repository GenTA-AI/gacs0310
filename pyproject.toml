[project]
name = "gacs-research-pipeline"
version = "0.1.0"
description = "Generative Affective Coordinate System - Research Pipeline"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line length handled separately

[tool.ruff.lint.per-file-ignores]
"check_secrets.py" = ["E402"]
"src/video_generator.py" = ["E741", "F401", "F541", "F841", "I001"]
"tests/test_*.py" = ["F401", "I001"]
